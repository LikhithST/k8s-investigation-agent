name: "k8s-investigation-agent"
acli_version: "1.14.0"
agent_directory: "app"
region: 'us-east1'
base_template: "adk_go"
generated_at: "2026-11-18T07:24:06.410250+00:00"
language: "go"
framework: "google-adk"
create_params:
  # The ADK name of the root agent, as rendered into the agent source. Rename
  # the agent and you must change it in both places: telemetry reports this as
  # gen_ai.agent.name, and it is what agents-cli reports for the project.
  root_agent_name: "k8s_investigation_agent"
  # The {app_name} the server serves the agent under (/apps/{app_name}/...),
  # as rendered into the server source. Change it in both places. ADK Python
  # serves /apps/ under the agent directory name, so keep the two equal there.
  app_name: "app"
  deployment_target: "none"
  session_type: "in_memory"
  cicd_runner: "skip"
  is_a2a: true
  agent_gateway: false
  agent_guidance_filename: "GEMINI.md"
  agent_runtime:
    identity_default: "agent_identity"
  cloud_run:
    identity_default: "agent_identity"
